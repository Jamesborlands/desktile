# XcodeGen spec for the SkyTile iPhone app + widget. Generate the project with:
#   cd clients/ios && xcodegen
# SkyTile.xcodeproj and the Info.plist / entitlements files are generated: edit this file instead.
#
# To sign with your own Apple ID, set DEVELOPMENT_TEAM below (or pick the team in Xcode).
# If the bundle ids are taken, change BUNDLE_ID and APP_GROUP (keep them matching).
name: SkyTile
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    BUNDLE_ID: com.seobubbles.skytile
    APP_GROUP: group.com.seobubbles.skytile
targets:
  SkyTile:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: SkyTile
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        SkyTileAppGroup: $(APP_GROUP)
        CFBundleURLTypes:
          - CFBundleURLName: $(BUNDLE_ID)
            CFBundleURLSchemes: [skytile]
    entitlements:
      path: App/SkyTile.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
    dependencies:
      - target: SkyTileWidget
  SkyTileWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: SkyTile
        SkyTileAppGroup: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/SkyTileWidget.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID).widget
