; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:advance-hmi]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = ESP32-S3-WROOM-1-N16R8
framework = arduino
monitor_speed = 115200
board_build.arduino.partitions = partitions.csv
board_upload.partitions = partitions.csv
; Rebuild the Arduino-ESP32 libs with Espressif's recommended settings for RGB
; panels: run code/rodata from PSRAM (no flash-cache stalls), IRAM-safe LCD ISR,
; 64-byte data cache lines. Fixes the screen drifting/shifting while WiFi is busy.
custom_sdkconfig =
	CONFIG_SPIRAM=y
	CONFIG_SPIRAM_MODE_OCT=y
	CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
	CONFIG_SPIRAM_XIP_FROM_PSRAM=y
	CONFIG_SPIRAM_FETCH_INSTRUCTIONS=y
	CONFIG_SPIRAM_RODATA=y
	CONFIG_ESP32S3_DATA_CACHE_64KB=y
	CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
	CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
	CONFIG_LCD_RGB_RESTART_IN_VSYNC=n
; RESTART_IN_VSYNC must stay off with bounce buffers: in IDF 5.5 it never resets the
; bounce-buffer counter, so one missed DMA interrupt flips which buffer gets filled
; and the picture stays shifted ~30 lines (top rows wrapped to the bottom) until reboot.
; Without it the driver resets the counter every frame and restarts only after a miss.
; Unused bundled component that fails its own config check in custom builds.
custom_component_remove =
	espressif/esp-modbus
build_flags = 
	-DLV_CONF_INCLUDE_SIMPLE
	-I include
lib_deps = 
	lvgl/lvgl@9.1.0
	adafruit/Adafruit BusIO@1.17.0
	adafruit/Adafruit SSD1306@2.5.13
	tamctec/TAMC_GT911@1.0.2
	robtillaart/TCA9554@0.1.1
	lovyan03/LovyanGFX@1.2.26
	bblanchon/ArduinoJson@7.2.0
	adafruit/Adafruit seesaw Library@1.7.9
